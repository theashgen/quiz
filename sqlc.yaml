version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - column: "accepted_answers.choice"
            go_type:
              type: "int"
              pointer: true
          - column: "accepted_answers.points"
            go_type: "int"
