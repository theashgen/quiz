<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:1px solid var(--border,#aaa);background:var(--card,transparent);color:var(--foreground);border-radius:var(--radius,10px);padding:11px 14px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;min-height:44px}button[aria-selected=true]{background:var(--primary,#6550cf);color:var(--primary-foreground,#fff);border-color:transparent}button:focus-visible{outline:2px solid var(--ring);outline-offset:3px}figure{margin:0}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border-radius:var(--radius,12px)}figcaption{font-size:12px;color:var(--muted-foreground);line-height:1.6;margin-top:10px}figcaption b{color:var(--foreground)}
</style></head><body><div class="tabs" role="tablist" aria-label="Design directions"><button role="tab" id="tab-a" aria-selected="true" aria-controls="a" onclick="show('a')">A · Peach Playground</button><button role="tab" id="tab-b" aria-selected="false" aria-controls="b" onclick="show('b')">B · Violet Social Club</button><button role="tab" id="tab-c" aria-selected="false" aria-controls="c" onclick="show('c')">C · Mint Curiosity</button></div><figure id="a" role="tabpanel" aria-labelledby="tab-a"><img src="/Users/theashgen/.t3/projects/quiz/docs/design-concepts/a-warm.png" alt="Peach Playground concept showing warm cream and orange desktop home, mobile question, and results"><figcaption><b>A — Closest to your reference.</b> Warm cream, orange actions, colorful bento cards and playful avatars.</figcaption></figure><figure id="b" role="tabpanel" aria-labelledby="tab-b" hidden><img src="/Users/theashgen/.t3/projects/quiz/docs/design-concepts/b-arcade.png" alt="Violet Social Club concept showing purple arcade desktop home, mobile question, and results"><figcaption><b>B — Bold and energetic.</b> Violet and lime, a compact navigation rail, oversized avatars and a vivid question card.</figcaption></figure><figure id="c" role="tabpanel" aria-labelledby="tab-c" hidden><img src="/Users/theashgen/.t3/projects/quiz/docs/design-concepts/c-mint.png" alt="Mint Curiosity concept showing calm mint and forest green desktop home, mobile question, and results"><figcaption><b>C — Calm and spacious.</b> Mint and forest green, a centered invitation, quiet surfaces and focused question screens.</figcaption></figure><script>function show(id){document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==id);document.querySelectorAll('[role=tab]').forEach(el=>el.setAttribute('aria-selected',String(el.id==='tab-'+id)))}document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')];let i=tabs.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;tabs[i].click();tabs[i].focus()});</script></body></html>
