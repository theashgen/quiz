services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: local-quiz-only
      POSTGRES_DB: quiz
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.10.3
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    build: .
    # Local-only development: read the owner-only bind-mounted TLS key.
    user: "0:0"
    ports: ["127.0.0.1:8443:8443"]
    environment:
      DATABASE_URL: postgres://quiz:local-quiz-only@postgres:5432/quiz?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_ORIGIN: https://localhost:8443
      LISTEN_ADDR: :8443
      TLS_CERT: /certs/localhost.pem
      TLS_KEY: /certs/localhost-key.pem
    volumes: ["./.local/certs:/certs:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
